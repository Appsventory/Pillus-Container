name: pillus
description: Flutter Docker Manager via SSH
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  dartssh2: ^2.22.5
  flutter_secure_storage: ^10.3.1
  google_fonts: ^8.2.1
  intl: ^0.20.2
  xterm2: ^5.2.0
  file_picker: ^10.3.9
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  rename: ^3.1.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  
  # Opsional tapi disarankan
  remove_alpha_ios: true
  min_sdk_android: 21

  # Adaptive Icon Android (opsional)
  # adaptive_icon_background: "#FFFFFF"
  # adaptive_icon_foreground: "assets/icon/app_icon.png"

  # ===== Desktop Support =====
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48          # ukuran icon Windows (min: 48, max: 256)

  linux:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0F172A"
  image: assets/splash.png
  android: true
  ios: true
  web: false

  android_12:
    color: "#FFFFFF"
    color_dark: "#0F172A"
    image: assets/splash.png


flutter:
  uses-material-design: true
  assets:
    - assets/

dependency_overrides:
  path_provider_foundation: 2.5.1